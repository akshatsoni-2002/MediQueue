<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications - MediQueue</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb;font-family:Arial,sans-serif}.top{background:#1473ea;padding:12px 28px;color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{color:#fff;text-decoration:none;font-size:26px;font-weight:700}.menu{display:flex;gap:10px}.cardx{background:#fff;border:0;border-radius:14px;box-shadow:0 6px 22px #00000012;padding:20px}.notif{padding:16px;border:1px solid #e7ebf1;border-radius:12px;margin-bottom:12px}.unread{border-left:5px solid #1473ea;background:#f7fbff}.time{color:#6c757d;font-size:13px}</style><link rel="stylesheet" href="/css/mediqueue.css">
</head><body class="mq-app-page"><div th:replace="~{fragments :: topbar}"></div><main class="container py-4" style="max-width:1000px"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="mb-1">🔔 Notifications</h1><p class="text-muted mb-0" th:text="${unread} + ' unread'">0 unread</p></div><form action="/notifications/read-all" method="post"><button class="btn btn-outline-primary">Mark all as read</button></form></div><div class="cardx"><div th:if="${notifications.isEmpty()}" class="text-center text-muted py-5">No notifications yet.</div><div th:each="n : ${notifications}" class="notif" th:classappend="${!n.read} ? ' unread' : ''"><div class="d-flex justify-content-between gap-3"><div><strong th:text="${n.type}">UPDATE</strong><p class="mb-1 mt-1" th:text="${n.message}">Message</p></div><div class="text-end"><div class="time" th:text="${#temporals.format(n.createdAt,'dd-MM-yyyy HH:mm')}">08-09-2026 10:00</div><form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button class="btn btn-sm btn-link">Mark read</button></form></div></div></div></div></main><div id="toast" style="position:fixed;right:24px;top:24px;z-index:2000;display:none;background:#fff;border-left:5px solid #1473ea;border-radius:12px;box-shadow:0 10px 35px #0003;padding:16px;max-width:380px"><strong>🔔 New notification</strong><div id="toastText" class="mt-1"></div></div><div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: notifications}"></div>
<script src="/js/mediqueue-ui.js"></script>
</body></html>
