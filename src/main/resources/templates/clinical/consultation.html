<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultation - MediQueue</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb;font-family:Arial}.box{max-width:800px;margin:45px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 8px 25px #0001}.top{background:#1473ea;padding:12px 28px}.brand{color:#fff;text-decoration:none;font-size:26px;font-weight:700}</style><link rel="stylesheet" href="/css/mediqueue.css">
</head><body class="mq-app-page"><div th:replace="~{fragments :: topbar}"></div><main class="box"><h2>Consultation</h2><p class="text-muted">Patient: <strong th:text="${appointment.patient.fullName}">Patient</strong> · Token <strong th:text="${appointment.tokenNumber}">1</strong></p><form th:action="@{/doctor/clinical/consultation/{id}(id=${appointment.id})}" method="post"><label class="form-label">Diagnosis</label><input name="diagnosis" class="form-control mb-3" th:value="${consultation.diagnosis}" required><label class="form-label">Clinical Notes</label><textarea name="notes" class="form-control mb-3" rows="8" required th:text="${consultation.notes}"></textarea><button class="btn btn-primary">Save Consultation</button><a href="/doctor/appointments" class="btn btn-outline-secondary ms-2">Back</a></form></main><div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: notifications}"></div>
<script src="/js/mediqueue-ui.js"></script>
</body></html>
