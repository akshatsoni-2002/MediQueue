<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical Records - MediQueue</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb;font-family:Arial}.box{max-width:1000px;margin:35px auto}.cardx{background:#fff;padding:22px;border-radius:14px;box-shadow:0 6px 22px #0001;margin-bottom:18px}</style><link rel="stylesheet" href="/css/mediqueue.css">
</head><body class="mq-app-page"><div th:replace="~{fragments :: topbar}"></div><main class="box"><h1>Medical Records</h1><p class="text-muted" th:text="${patient != null ? patient.fullName : 'Patient'}">Patient</p><div class="cardx"><h4>Add Medical Record</h4><form th:action="@{/doctor/clinical/records/{id}(id=${patient.id})}" method="post"><input name="diagnosis" class="form-control mb-2" placeholder="Diagnosis" required><textarea name="notes" class="form-control mb-2" rows="4" placeholder="Notes" required></textarea><button class="btn btn-primary">Save Record</button></form></div><div class="cardx"><h4>History</h4><div th:if="${records.isEmpty()}" class="text-muted">No records yet.</div><div th:each="r:${records}" class="border-bottom py-3"><strong th:text="${r.diagnosis}">Diagnosis</strong><div th:text="${r.notes}">Notes</div><small class="text-muted" th:text="${#temporals.format(r.createdAt,'dd-MM-yyyy HH:mm')}">date</small></div></div><div class="cardx"><h4>Prescriptions</h4><form th:action="@{/doctor/clinical/prescriptions/{id}(id=${patient.id})}" method="post"><textarea name="medicines" class="form-control mb-2" rows="3" placeholder="Medicines" required></textarea><textarea name="instructions" class="form-control mb-2" rows="3" placeholder="Instructions" required></textarea><button class="btn btn-success">Add Prescription</button></form><div th:each="r:${prescriptions}" class="border-bottom py-3"><strong>Medicines</strong><div th:text="${r.medicines}">Medicines</div><div><strong>Instructions:</strong> <span th:text="${r.instructions}">Instructions</span></div></div></div></main><div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: notifications}"></div>
<script src="/js/mediqueue-ui.js"></script>
</body></html>
