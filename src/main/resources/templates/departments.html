<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Departments | MediQueue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f4f8fc;
            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar-custom {
            background-color: #0d6efd;
            padding: 12px 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .navbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand:hover {
            color: white;
        }

        .menu-wrapper {
            position: relative;
        }

        .menu-button {
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: transparent;
            color: white;
            border-radius: 8px;
            padding: 9px 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-button:hover {
            background-color: rgba(255, 255, 255, 0.12);
        }

        .menu-dots {
            font-size: 23px;
            line-height: 15px;
        }

        .navigation-menu {
            display: none;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 220px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 8px;
            z-index: 1000;
        }

        .navigation-menu.show {
            display: block;
        }

        .navigation-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 13px;
            color: #212529;
            text-decoration: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 500;
        }

        .navigation-menu a:hover {
            background-color: #f0f5ff;
            color: #0d6efd;
        }

        .navigation-menu a span {
            width: 20px;
            text-align: center;
            font-size: 17px;
        }

        .navigation-divider {
            height: 1px;
            background: #e9ecef;
            margin: 6px 4px;
        }

        .navigation-logout-form {
            margin: 0;
        }

        .navigation-logout {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 13px;
            color: #212529;
            background: transparent;
            border: 0;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
        }

        .navigation-logout:hover {
            background-color: #fff1f1;
            color: #dc3545;
        }

        .navigation-logout span {
            width: 20px;
            text-align: center;
            font-size: 17px;
        }


        /* =========================
           CARDS
        ========================= */

        .card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           PAGE
        ========================= */

        .page-title {
            font-weight: 700;
        }


        /* =========================
           TABLE
        ========================= */

        .table th {
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .action-buttons {
            white-space: nowrap;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .navbar-custom {
                padding: 12px 20px;
            }

            .brand {
                font-size: 24px;
            }

        }


        @media (max-width: 600px) {

            .navbar-custom {
                padding: 12px 16px;
            }

            .brand {
                font-size: 21px;
            }

            .navigation-menu {
                width: 200px;
            }

        }

    </style>

<link rel="stylesheet" href="/css/mediqueue.css">
</head>


<body class="mq-app-page">


<!-- =========================
     NAVBAR
========================= -->

<div th:replace="~{fragments :: topbar}"></div>



<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container py-5">


    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="page-title mb-1">
                Department Management
            </h2>

            <p class="text-muted mb-0">
                Create and manage hospital departments.
            </p>

        </div>

    </div>



    <div class="row g-4">


        <!-- =========================
             ADD DEPARTMENT
        ========================= -->

        <div class="col-lg-4">

            <div class="card p-4">

                <h5 class="fw-bold mb-4">
                    Add Department
                </h5>


                <form th:action="@{/admin/departments/add}"
                      method="post">


                    <!-- Department Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Department Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="e.g. Cardiology"
                               required>

                    </div>


                    <!-- Description -->

                    <div class="mb-4">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Short department description"></textarea>

                    </div>


                    <!-- Submit -->

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Add Department

                    </button>


                </form>

            </div>

        </div>



        <!-- =========================
             DEPARTMENT LIST
        ========================= -->

        <div class="col-lg-8">

            <div class="card p-4">


                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h5 class="fw-bold mb-0">
                        All Departments
                    </h5>

                    <span class="badge text-bg-primary"
                          th:text="${departments.size()} + ' Total'">

                        0 Total

                    </span>

                </div>



                <!-- EMPTY STATE -->

                <div th:if="${departments.isEmpty()}"
                     class="text-center text-muted py-5">

                    <h6>
                        No departments available.
                    </h6>

                    <p class="mb-0">
                        Add your first department using the form.
                    </p>

                </div>



                <!-- TABLE -->

                <div class="table-responsive"
                     th:unless="${departments.isEmpty()}">

                    <table class="table align-middle">

                        <thead>

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Status
                            </th>

                            <th class="text-end">
                                Action
                            </th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="department : ${departments}">


                            <!-- ID -->

                            <td th:text="${department.id}">
                                1
                            </td>


                            <!-- NAME -->

                            <td>

                                <span class="fw-semibold"
                                      th:text="${department.name}">

                                    General Medicine

                                </span>

                            </td>


                            <!-- DESCRIPTION -->

                            <td th:text="${department.description}">
                                Description
                            </td>


                            <!-- STATUS -->

                            <td>

                                <span
                                        class="badge text-bg-success"
                                        th:if="${department.active}">

                                    Active

                                </span>

                                <span
                                        class="badge text-bg-secondary"
                                        th:unless="${department.active}">

                                    Inactive

                                </span>

                            </td>


                            <!-- ACTIONS -->

                            <td class="text-end action-buttons">


                                <!-- EDIT -->

                                <a
                                        class="btn btn-sm btn-outline-primary"
                                        th:href="@{/admin/departments/edit/{id}(id=${department.id})}">

                                    Edit

                                </a>


                                <!-- ACTIVATE / DEACTIVATE -->

                                <a
                                        class="btn btn-sm"
                                        th:classappend="${department.active} ? ' btn-outline-warning' : ' btn-outline-success'"
                                        th:href="@{/admin/departments/toggle/{id}(id=${department.id})}"
                                        th:text="${department.active} ? 'Deactivate' : 'Activate'">

                                    Deactivate

                                </a>


                                <!-- DELETE -->

                                <a
                                        class="btn btn-sm btn-outline-danger"
                                        th:href="@{/admin/departments/delete/{id}(id=${department.id})}"
                                        onclick="return confirm('Delete this department permanently?');">

                                    Delete

                                </a>


                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: notifications}"></div>
<script src="/js/mediqueue-ui.js"></script>
</body>

</html>
