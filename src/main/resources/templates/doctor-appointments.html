<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Appointments - MediQueue</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .top {
            background: #1473ea;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            color: #fff;
            text-decoration: none;
            font-size: 26px;
            font-weight: 700;
        }

        .cardx {
            background: #fff;
            border: 0;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 6px 22px #0001;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
    </style>
<link rel="stylesheet" href="/css/mediqueue.css">
</head>

<body class="mq-app-page">

<div th:replace="~{fragments :: topbar}"></div>

<main class="container py-4">

    <h1>My Appointments</h1>

    <p
            class="text-muted"
            th:text="${doctor.fullName}">
        Doctor
    </p>

    <div
            th:if="${error}"
            class="alert alert-danger"
            th:text="${error}">
        Error
    </div>

    <div class="cardx">

        <div
                th:if="${appointments.isEmpty()}"
                class="text-center text-muted py-5">

            No appointments.

        </div>

        <div
                class="table-responsive"
                th:unless="${appointments.isEmpty()}">

            <table class="table">

                <thead>

                <tr>
                    <th>Token</th>
                    <th>Patient</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="a : ${appointments}">

                    <td>
                        <span
                                class="badge text-bg-primary"
                                th:text="${a.tokenNumber}">
                            1
                        </span>
                    </td>

                    <td th:text="${a.patient.fullName}">
                        Patient
                    </td>

                    <td
                            th:text="${#temporals.format(a.appointmentDate,'dd-MM-yyyy')}">
                        08-09-2026
                    </td>

                    <td
                            th:text="${a.appointmentTime != null ? #temporals.format(a.appointmentTime,'hh:mm a') : 'Not set'}">
                        10:00 AM
                    </td>

                    <td>

                        <span
                                th:if="${a.status == 'WAITING'}"
                                class="badge text-bg-warning">
                            WAITING
                        </span>

                        <span
                                th:if="${a.status == 'CALLED'}"
                                class="badge text-bg-info">
                            CALLED
                        </span>

                        <span
                                th:if="${a.status == 'IN_CONSULTATION'}"
                                class="badge text-bg-primary">
                            IN CONSULTATION
                        </span>

                        <span
                                th:if="${a.status == 'COMPLETED'}"
                                class="badge text-bg-success">
                            COMPLETED
                        </span>

                        <span
                                th:if="${a.status == 'CANCELLED'}"
                                class="badge text-bg-danger">
                            CANCELLED
                        </span>

                    </td>

                    <td>

                        <div class="action-buttons">

                            <!-- Edit / Reschedule -->
                            <a
                                    th:if="${a.status != 'COMPLETED' and a.status != 'CANCELLED'}"
                                    class="btn btn-sm btn-outline-primary"
                                    th:href="@{/doctor/appointments/edit/{id}(id=${a.id})}">

                                ✏️ Edit / Reschedule

                            </a>

                            <!-- Cancel -->
                            <form
                                    th:if="${a.status != 'COMPLETED' and a.status != 'CANCELLED'}"
                                    th:action="@{/doctor/appointments/cancel/{id}(id=${a.id})}"
                                    method="post"
                                    style="display:inline"
                                    onsubmit="return confirm('Are you sure you want to cancel this appointment?');">

                                <button
                                        type="submit"
                                        class="btn btn-sm btn-outline-danger">

                                    ✕ Cancel

                                </button>

                            </form>

                            <!-- Consultation -->
                            <a
                                    th:if="${a.status == 'COMPLETED'}"
                                    class="btn btn-sm btn-success"
                                    th:href="@{/doctor/clinical/consultation/{id}(id=${a.id})}">

                                🩺 Consultation

                            </a>

                            <!-- Completed / Cancelled -->
                            <span
                                    th:if="${a.status == 'COMPLETED'}"
                                    class="text-muted small">

                                Finished

                            </span>

                            <span
                                    th:if="${a.status == 'CANCELLED'}"
                                    class="text-danger small">

                                Cancelled

                            </span>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: notifications}"></div>
<script src="/js/mediqueue-ui.js"></script>
</body>

</html>
