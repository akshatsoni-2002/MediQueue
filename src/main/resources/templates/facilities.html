<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPD & Rooms - MediQueue</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb;font-family:Arial}.top{background:#1473ea;padding:12px 28px;color:#fff;display:flex;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-size:26px;font-weight:700}.cardx{background:#fff;border-radius:14px;padding:20px;box-shadow:0 6px 22px #0001;height:100%}.status{font-size:12px;padding:5px 9px;border-radius:8px}.open{background:#d1e7dd;color:#0f5132}.closed{background:#f8d7da;color:#842029}.bed{border:1px solid #e4e8ee;border-radius:10px;padding:14px;margin-bottom:10px}.available{border-left:5px solid #198754}.occupied{border-left:5px solid #dc3545}</style><link rel="stylesheet" href="/css/mediqueue.css">
</head><body class="mq-app-page"><div th:replace="~{fragments :: topbar}"></div><main class="container py-4"><h1>OPD & Rooms / Beds</h1><p class="text-muted">Reception and administration view of operational facilities.</p><div class="row g-4"><div class="col-lg-5"><div class="cardx"><h4>OPD Units</h4><form action="/facilities/opd" method="post" class="row g-2 mb-4"><div class="col-12"><input name="name" class="form-control" placeholder="OPD name" required></div><div class="col-md-6"><select name="departmentId" class="form-select"><option value="">Department</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}">Department</option></select></div><div class="col-md-6"><select name="doctorId" class="form-select"><option value="">Doctor</option><option th:each="d:${doctors}" th:value="${d.id}" th:text="${d.fullName}">Doctor</option></select></div><div class="col-8"><input name="roomNumber" class="form-control" placeholder="Room number"></div><div class="col-4"><button class="btn btn-primary w-100">Add OPD</button></div></form><div th:if="${opds.isEmpty()}" class="text-muted">No OPD units configured.</div><div th:each="o:${opds}" class="bed"><div class="d-flex justify-content-between"><strong th:text="${o.name}">OPD</strong><span class="status" th:classappend="${o.open}?' open':' closed'" th:text="${o.open}?'OPEN':'CLOSED'">OPEN</span></div><div class="small text-muted mt-1"><span th:text="${o.department != null ? o.department.name : 'No department'}">Department</span> · <span th:text="${o.doctor != null ? o.doctor.fullName : 'No doctor'}">Doctor</span> · Room <span th:text="${o.roomNumber != null ? o.roomNumber : '-'}">101</span></div><form class="mt-2" th:action="@{/facilities/opd/{id}/toggle(id=${o.id})}" method="post"><button class="btn btn-sm btn-outline-secondary" th:text="${o.open}?'Close OPD':'Open OPD'">Close</button></form></div></div></div><div class="col-lg-7"><div class="cardx"><div class="d-flex justify-content-between align-items-center"><h4>Rooms & Beds</h4><span class="badge text-bg-primary" th:text="${beds.size()}+' Beds'">0 Beds</span></div><form action="/facilities/bed" method="post" class="row g-2 mb-4"><div class="col-md-4"><input name="ward" class="form-control" placeholder="Ward"></div><div class="col-md-3"><input name="roomNumber" class="form-control" placeholder="Room" required></div><div class="col-md-3"><input name="bedNumber" class="form-control" placeholder="Bed" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div></form><div th:if="${beds.isEmpty()}" class="text-muted">No beds configured.</div><div th:each="b:${beds}" class="bed" th:classappend="${b.occupied}?' occupied':' available'"><div class="d-flex justify-content-between"><strong>Room <span th:text="${b.roomNumber}">101</span> · Bed <span th:text="${b.bedNumber}">A</span></strong><span th:text="${b.occupied ? 'OCCUPIED':'AVAILABLE'}">AVAILABLE</span></div><div class="small text-muted" th:text="${b.ward != null ? b.ward : 'Ward not set'}">Ward</div><div th:if="${b.occupied}" class="mt-2"><strong th:text="${b.patient.fullName}">Patient</strong><form th:action="@{/facilities/bed/{id}/release(id=${b.id})}" method="post" class="d-inline ms-2"><button class="btn btn-sm btn-outline-danger">Release</button></form></div><form th:unless="${b.occupied}" th:action="@{/facilities/bed/{id}/assign(id=${b.id})}" method="post" class="row g-2 mt-2"><div class="col-8"><select name="patientId" class="form-select" required><option value="">Assign patient</option><option th:each="p:${patients}" th:value="${p.id}" th:text="${p.fullName}">Patient</option></select></div><div class="col-4"><button class="btn btn-outline-primary w-100">Assign</button></div></form></div></div></div></div></main><div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: notifications}"></div>
<script src="/js/mediqueue-ui.js"></script>
</body></html>
