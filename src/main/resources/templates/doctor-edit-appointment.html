<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Appointment - MediQueue</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb;font-family:Arial}.box{max-width:650px;margin:55px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 8px 25px #0001}.top{background:#1473ea;padding:12px 28px}.brand{color:#fff;text-decoration:none;font-size:26px;font-weight:700}</style><link rel="stylesheet" href="/css/mediqueue.css">
</head><body class="mq-app-page"><div th:replace="~{fragments :: topbar}"></div><main class="box"><h2>Edit Appointment</h2><p class="text-muted" th:text="${appointment.patient.fullName}">Patient</p><form th:action="@{/doctor/appointments/edit/{id}(id=${appointment.id})}" method="post"><label class="form-label">Appointment Date</label><input class="form-control mb-3" type="date" name="appointmentDate" th:value="${appointment.appointmentDate}" required><label class="form-label">Appointment Time</label><input class="form-control mb-3" type="time" name="appointmentTime" th:value="${appointment.appointmentTime}"><div class="d-flex gap-2"><button class="btn btn-primary">Save & Notify</button><a href="/doctor/appointments" class="btn btn-outline-secondary">Cancel</a></div></form></main>
<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: notifications}"></div>
<script src="/js/mediqueue-ui.js"></script>
</body></html>
