<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Find Doctors</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/mediqueue.css"></head><body class="mq-app-page"><div th:replace="~{fragments :: topbar}"></div><main class="mq-page-shell"><section class="mq-page-heading"><div><span class="mq-section-kicker">CARE NETWORK</span><h1>Doctors built around your needs.</h1><p>Explore active specialists, read their professional profile and request a chat or video consultation.</p></div><a class="btn btn-primary" href="/patient/book">Book appointment →</a></section><div class="mq-doctor-grid"><article class="mq-doctor-profile" th:each="doctor : ${doctors}"><div class="mq-doctor-top"><div class="mq-doctor-avatar" th:text="${#strings.substring(doctor.fullName.trim(),0,1).toUpperCase()}">R</div><div><span class="mq-live-status">● AVAILABLE</span><h2 th:text="${doctor.fullName}">Dr. Rahul</h2><p th:text="${doctor.specialization}">Cardiology</p></div></div><div class="mq-doctor-meta"><span th:text="${doctor.department != null ? doctor.department.name : 'Hospital'}">Cardiology</span><span th:text="${doctor.averageConsultationMinutes + ' min avg.'}">15 min avg.</span></div><p class="mq-doctor-bio" th:text="${doctor.bio != null and !doctor.bio.isBlank() ? doctor.bio : 'Professional healthcare specialist available through MediQueue for appointments and live queue care.'}">Professional bio</p><div class="mq-doctor-actions"><a class="btn btn-primary" th:href="@{'/patient/book?doctorId=' + ${doctor.id}}">Book</a><form method="post" th:action="@{'/patient/doctors/' + ${doctor.id} + '/contact'}"><input type="hidden" name="action" value="CHAT"><button class="btn btn-outline-primary" type="submit">Chat</button></form><form method="post" th:action="@{'/patient/doctors/' + ${doctor.id} + '/contact'}"><input type="hidden" name="action" value="CALL"><button class="btn btn-outline-secondary" type="submit">Book call</button></form></div></article></div></main><div th:replace="~{fragments :: notifications}"></div><div th:replace="~{fragments :: footer}"></div><script src="/js/mediqueue-ui.js"></script></body></html>
