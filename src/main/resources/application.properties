spring.application.name=MediQueue

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mediqueue_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# Patient Google login
mediqueue.google.enabled=${MEDIQUEUE_GOOGLE_ENABLED:false}

# Patient email notifications
mediqueue.mail.enabled=${MEDIQUEUE_MAIL_ENABLED:false}
mediqueue.mail.host=${MQ_MAIL_HOST:smtp.gmail.com}
mediqueue.mail.port=${MQ_MAIL_PORT:587}
mediqueue.mail.username=${MQ_MAIL_USERNAME:}
mediqueue.mail.password=${MQ_MAIL_APP_PASSWORD:}
mediqueue.mail.starttls=${MQ_MAIL_STARTTLS:true}

# Patient Google Sign-In
# Configure these as environment variables when Google OAuth is enabled.
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Profile photo upload limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB